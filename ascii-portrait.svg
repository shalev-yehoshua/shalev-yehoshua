<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="840" viewBox="0 0 1000 840" role="img" aria-labelledby="title desc">
  <title id="title">ASCII portrait of Shalev Yehoshua</title>
  <desc id="desc">A red and white ASCII portrait displayed inside a dark terminal window.</desc>
  <defs>
    <linearGradient id="terminalBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.55" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#170307"/>
    </linearGradient>
    <linearGradient id="asciiGradient" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ff1744"/>
      <stop offset="0.38" stop-color="#ff526f"/>
      <stop offset="0.72" stop-color="#f0f6fc"/>
      <stop offset="1" stop-color="#ff1744"/>
    </linearGradient>
    <linearGradient id="scanGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff1744" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff1744" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#ff1744" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="portraitClip">
      <rect x="28" y="88" width="944" height="684" rx="10"/>
    </clipPath>
  </defs>

  <rect width="1000" height="840" rx="22" fill="#010203"/>
  <rect x="12" y="12" width="976" height="816" rx="18" fill="url(#terminalBg)" stroke="#30363d" stroke-width="2"/>
  <rect x="12" y="12" width="976" height="76" rx="18" fill="#161b22"/>
  <path d="M12 70H988V88H12Z" fill="#161b22"/>
  <line x1="12" y1="88" x2="988" y2="88" stroke="#30363d" stroke-width="2"/>

  <circle cx="48" cy="50" r="9" fill="#ff5f56"/>
  <circle cx="76" cy="50" r="9" fill="#ffbd2e"/>
  <circle cx="104" cy="50" r="9" fill="#27c93f"/>
  <text x="140" y="57" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20">
    shalev-yehoshua@github:~$ ./portrait.sh
  </text>
  <rect x="594" y="39" width="11" height="23" fill="#ff1744">
    <animate attributeName="opacity" values="1;1;0;0;1" dur="1.15s" repeatCount="indefinite"/>
  </rect>

